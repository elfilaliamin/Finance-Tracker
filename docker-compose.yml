version: "3.8"

networks:
  finance-tracker-net:
    driver: bridge
    name: finance-tracker-net

volumes:
  ft-pgdata:
    name: ft-pgdata

services:
  db:
    image: postgres:16-alpine
    container_name: ft-db
    restart: unless-stopped
    networks:
      - finance-tracker-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financetracker}
      POSTGRES_USER: ${POSTGRES_USER:-ft_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
        -c shared_buffers=64MB
        -c work_mem=4MB
        -c maintenance_work_mem=16MB
        -c max_connections=25
        -c effective_cache_size=128MB
        -c synchronous_commit=off
    volumes:
      - ft-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ft_user} -d ${POSTGRES_DB:-financetracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    image: finance-tracker-backend:latest
    container_name: ft-backend
    restart: unless-stopped
    networks:
      - finance-tracker-net
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ft_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-financetracker}
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@financetracker.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Admin initial password required}
      TRUST_PROXY: "1"
      NODE_OPTIONS: "--max-old-space-size=256"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    image: finance-tracker-frontend:latest
    container_name: ft-frontend
    restart: unless-stopped
    networks:
      - finance-tracker-net
    ports:
      - "127.0.0.1:3004:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

