<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="ft-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="ft-grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="ft-grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="48" height="48" rx="12" fill="url(#ft-grad-bg)" />
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="#34d399" stroke-opacity="0.35" fill="none" />

  <!-- Ascending Wealth Growth Bars -->
  <rect x="10" y="27" width="5.5" height="10" rx="2" fill="#10b981" fill-opacity="0.6" />
  <rect x="18" y="20" width="5.5" height="17" rx="2" fill="#10b981" fill-opacity="0.85" />
  <rect x="26" y="14" width="5.5" height="23" rx="2" fill="url(#ft-grad-accent)" />

  <!-- Upward Trendline & Dynamic Arrow -->
  <path d="M12 25L19 18L26 21L36 11" stroke="#ffffff" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M29 11H36V18" stroke="#ffffff" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sparkling Gold Coin at the Peak -->
  <circle cx="36" cy="11" r="3.5" fill="url(#ft-grad-gold)" stroke="#064e3b" stroke-width="1.2" />
</svg>
